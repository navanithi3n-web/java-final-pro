<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance – IronPulse</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
        <div class="top-header">
            <div class="header-title"><h1>Attendance Log</h1><p>View daily check-ins and history</p></div>
            <div id="user-badge"></div>
        </div>
        <div class="flex-between mb-3" style="flex-wrap:wrap; gap:0.75rem;">
            <div style="display:flex; align-items:center; gap:0.5rem;">
                <label for="attendance-date" style="font-weight:600; font-size:0.875rem;">Filter by Date:</label>
                <input type="date" id="attendance-date" class="form-control" style="width:auto;">
            </div>
            <a href="/checkin" class="btn btn-primary">🔑 Quick Check-In</a>
        </div>
        <div class="card">
            <div class="card-body p-0"><div class="table-responsive">
                <table class="data-table">
                    <thead><tr><th>Check-In ID</th><th>Member</th><th>Phone</th><th>Check-In Time</th></tr></thead>
                    <tbody id="attendance-tbody"><tr><td colspan="4" class="text-center text-muted">Loading…</td></tr></tbody>
                </table>
            </div></div>
        </div>
    </main>
</div>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/layout.js"></script><script src="/js/attendance.js"></script>
<script>document.addEventListener('DOMContentLoaded', initAttendance);</script>
</body>
</html>
