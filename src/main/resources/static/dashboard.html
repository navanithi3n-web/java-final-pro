<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard – IronPulse</title>
    <meta name="description" content="IronPulse Dashboard – Gym stats at a glance">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
        <div class="top-header">
            <div class="header-title"><h1>Dashboard</h1><p>Overview of your gym today</p></div>
            <div id="user-badge"></div>
        </div>

        <div class="stats-grid">
            <div class="stat-card" id="card-total-members">
                <div class="stat-icon-wrapper blue">👥</div>
                <div class="stat-info">
                    <span class="stat-title">Total Members</span>
                    <span class="stat-value" id="stat-total-members">–</span>
                    <span class="stat-sub">Registered members</span>
                </div>
            </div>
            <div class="stat-card" id="card-active-memberships">
                <div class="stat-icon-wrapper green">🏷️</div>
                <div class="stat-info">
                    <span class="stat-title">Active Memberships</span>
                    <span class="stat-value" id="stat-active-memberships">–</span>
                    <span class="stat-sub">Currently active</span>
                </div>
            </div>
            <div class="stat-card" id="card-today-checkins">
                <div class="stat-icon-wrapper amber">🔑</div>
                <div class="stat-info">
                    <span class="stat-title">Today's Check-Ins</span>
                    <span class="stat-value" id="stat-today-checkins">–</span>
                    <span class="stat-sub">Since midnight</span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h3>Today's Check-Ins</h3></div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Time</th></tr></thead>
                        <tbody id="recent-checkins-body"><tr><td colspan="4" class="text-center text-muted">Loading…</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/layout.js"></script><script src="/js/dashboard.js"></script>
</body>
</html>
