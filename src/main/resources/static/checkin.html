<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Check-In – IronPulse</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
        <div class="top-header">
            <div class="header-title"><h1>Quick Check-In</h1><p>Member attendance check-in terminal</p></div>
            <div id="user-badge"></div>
        </div>
        <div class="card" style="max-width:560px; margin: 0 auto;">
            <div class="card-header"><h3>⚡ Terminal Scanner / Entry</h3></div>
            <div class="card-body">
                <form id="checkin-form">
                    <div class="form-group">
                        <label for="checkin-input">Member ID or 10-digit Phone Number <span class="required">*</span></label>
                        <input type="text" id="checkin-input" class="form-control" placeholder="Enter ID (e.g. 1) or Phone (e.g. 9876543210)" autofocus required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.75rem;">🔑 Check In</button>
                    </div>
                </form>
                <div id="checkin-feedback" style="margin-top:1.5rem;"></div>
            </div>
        </div>
    </main>
</div>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/layout.js"></script><script src="/js/checkin.js"></script>
</body>
</html>
