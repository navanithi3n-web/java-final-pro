<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Attendance – IronPulse</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
        <div class="top-header">
            <div class="header-title">
                <p class="breadcrumb"><a href="/attendance">Attendance</a> › <span id="breadcrumb-name">…</span></p>
                <h1>Member Attendance History</h1>
            </div>
            <div id="user-badge"></div>
        </div>
        <div class="flex-between mb-3">
            <div>
                <span>Total Check-Ins: </span>
                <strong id="total-checkins" class="badge badge-primary">0</strong>
            </div>
            <a href="/attendance" class="btn btn-secondary">← Back to Attendance</a>
        </div>
        <div class="card">
            <div class="card-body p-0"><div class="table-responsive">
                <table class="data-table">
                    <thead><tr><th>Check-In ID</th><th>Date</th><th>Time</th></tr></thead>
                    <tbody id="member-attendance-tbody"><tr><td colspan="3" class="text-center text-muted">Loading…</td></tr></tbody>
                </table>
            </div></div>
        </div>
    </main>
</div>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/layout.js"></script><script src="/js/attendance.js"></script>
<script>document.addEventListener('DOMContentLoaded', initMemberAttendance);</script>
</body>
</html>
