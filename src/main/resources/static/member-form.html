<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Form – IronPulse</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
        <div class="top-header">
            <div class="header-title">
                <p class="breadcrumb"><a href="/members">Members</a> › <span id="breadcrumb-action">Register</span></p>
                <h1 id="form-title">Register Member</h1>
            </div>
            <div id="user-badge"></div>
        </div>
        <div class="card" style="max-width:560px;">
            <div class="card-body">
                <div class="login-error" id="form-error" style="display:none; background:var(--red-light); color:var(--red); border-left:4px solid var(--red); padding:0.75rem 1rem; border-radius:var(--radius-sm); font-weight:600; margin-bottom:1rem;"></div>
                <form id="member-form">
                    <div class="form-group">
                        <label for="field-name">Full Name <span class="required">*</span></label>
                        <input type="text" id="field-name" class="form-control" placeholder="e.g. John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="field-phone">Phone (10 digits) <span class="required">*</span></label>
                        <input type="text" id="field-phone" class="form-control" placeholder="e.g. 9876543210" pattern="[0-9]{10}" required>
                    </div>
                    <div class="form-group">
                        <label for="field-email">Email <span class="required">*</span></label>
                        <input type="email" id="field-email" class="form-control" placeholder="e.g. john@example.com" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Member</button>
                        <a href="/members" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/layout.js"></script><script src="/js/members.js"></script>
<script>document.addEventListener('DOMContentLoaded', initMemberForm);</script>
</body>
</html>
