<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Detail – IronPulse</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
        <div class="top-header">
            <div class="header-title">
                <p class="breadcrumb"><a href="/members">Members</a> › <span id="breadcrumb-name">…</span></p>
                <h1>Member Detail</h1>
            </div>
            <div id="user-badge"></div>
        </div>
        <div id="member-detail">
            <div class="grid-2-col">
                <div class="card">
                    <div class="card-header"><h3>Profile</h3></div>
                    <div class="card-body">
                        <p><strong>Name:</strong> <span id="detail-name">–</span></p>
                        <p><strong>Phone:</strong> <span id="detail-phone">–</span></p>
                        <p><strong>Email:</strong> <span id="detail-email">–</span></p>
                        <p><strong>Joined:</strong> <span id="detail-join-date">–</span></p>
                        <div class="form-actions" style="margin-top:1.25rem;">
                            <a id="edit-link" class="btn btn-secondary btn-sm">✏️ Edit</a>
                            <a id="assign-link" class="btn btn-primary btn-sm">🏷️ Assign Membership</a>
                            <a id="attendance-link" class="btn btn-secondary btn-sm">📅 View Attendance</a>
                            <button id="delete-member-btn" class="btn btn-danger btn-sm" data-role="ADMIN">🗑️ Delete</button>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>Membership History</h3></div>
                    <div class="card-body p-0"><div class="table-responsive">
                        <table class="data-table">
                            <thead><tr><th>ID</th><th>Plan</th><th>Start</th><th>Expiry</th><th>Status</th></tr></thead>
                            <tbody id="memberships-tbody"><tr><td colspan="5" class="text-center text-muted">Loading…</td></tr></tbody>
                        </table>
                    </div></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><h3>Last 10 Check-Ins</h3></div>
                <div class="card-body p-0"><div class="table-responsive">
                    <table class="data-table">
                        <thead><tr><th>ID</th><th>Time</th></tr></thead>
                        <tbody id="checkins-tbody"><tr><td colspan="2" class="text-center text-muted">Loading…</td></tr></tbody>
                    </table>
                </div></div>
            </div>
        </div>
    </main>
</div>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/layout.js"></script><script src="/js/members.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const id = window.location.pathname.split('/')[2];
    document.getElementById('edit-link').href = '/members/' + id + '/edit';
    document.getElementById('assign-link').href = '/memberships/new?memberId=' + id;
    document.getElementById('attendance-link').href = '/attendance/member/' + id;
    initMemberDetail();
});
</script>
</body>
</html>
