<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memberships – IronPulse</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
        <div class="top-header">
            <div class="header-title"><h1>Memberships</h1><p>Active and past gym memberships</p></div>
            <div id="user-badge"></div>
        </div>
        <div class="flex-between mb-3" style="flex-wrap:wrap; gap:0.75rem;">
            <div></div>
            <a href="/memberships/new" class="btn btn-primary">+ Assign Membership</a>
        </div>
        <div class="card">
            <div class="card-body p-0"><div class="table-responsive">
                <table class="data-table">
                    <thead><tr><th>ID</th><th>Member</th><th>Plan</th><th>Start Date</th><th>Expiry Date</th><th>Status</th><th></th></tr></thead>
                    <tbody id="memberships-tbody"><tr><td colspan="7" class="text-center text-muted">Loading…</td></tr></tbody>
                </table>
            </div></div>
        </div>
    </main>
</div>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/layout.js"></script><script src="/js/memberships.js"></script>
<script>document.addEventListener('DOMContentLoaded', initMembershipsList);</script>
</body>
</html>
